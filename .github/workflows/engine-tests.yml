name: Engine search tests

# The full set of suites that drive a real MCTS search. CI skips them because
# they need minutes of CPU per file on a shared runner (see runsEngineSuites in
# test/helpers/engineHarness.ts); CI runs only the bounded smoke subset. This
# runs all of them weekly and on demand, with a timeout sized for the runner.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engine search suites
        run: npm run test:engine
