name: CI

# Pull requests, and pushes to main.
#
# `push` was unrestricted here once, which fired alongside `pull_request` for
# the same branch and ran this job twice per change; scoping it to main fixes
# that -- a pull request gets one run, and the merge gets a separate run on
# different content.
#
# The comment this replaces said a push to main was "already covered by the
# deploy workflow, which runs the same gates". That was false, and it is the
# gap this trigger closes: the deploy runs audit, lint, unit tests and the
# build, but no deploy in any of the three sibling repos runs a browser suite.
# Those live only here, so without a push trigger nothing browser-level ever
# ran against main.
#
# This workflow deploys nothing. If it goes red the site still publishes, which
# is the reason the browser suites belong here rather than in the deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Matches deploy-pages.yml. They used to differ -- 20 here, 24 there -- so
      # a pull request was verified on one major and the thing that actually
      # ships was built on another. A change that works on 20 and breaks on 24
      # passed review and failed the deploy.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      # typecheck -> test:typecheck -> lint -> test -> build, chained so the
      # first failure stops it. The same command developers run locally.
      #
      # CI is set by Actions, which skips the 71 tests that drive a real MCTS
      # search. Those need hundreds of visits through the net on the CPU
      # backend: seconds on a laptop, minutes here — enough that some exceeded
      # their 180s timeout and others asserted visit counts the search never
      # reached. Set ENGINE_TESTS=1 to run them anyway, and expect it to be slow.
      - name: Verify
        run: npm run verify

      # STILL NOT WIRED UP. This repo's only browser-level suite, and the one
      # thing in these three repos that is not covered by CI. Both siblings run
      # theirs here.
      #
      # Four attempts, three causes found and fixed in check-viewports.mjs:
      # Chrome could not start its sandbox; a CDP evaluate lost its execution
      # context to an in-flight navigation; several waits counted frames or
      # slept a flat 300ms instead of waiting for the thing they wanted. Those
      # fixes are real and are staying.
      #
      # What is left is undiagnosed. On a runner, at 768x1024 -- the first
      # mobile viewport -- input stops reaching the app: F11 does not trigger
      # the fullscreen handler, shortcut-opened dialogs never open, and the
      # board then measures as missing because the QA interactions before it
      # left the page in a state the sweep did not expect. It does not
      # reproduce locally: unthrottled and 4x CPU throttling pass reliably, and
      # at 6x a different thing fails first (the photo board's lazy chunk).
      #
      # Reproduce a runner with: VIEWPORT_CPU_THROTTLE=6 npm run test:viewport
      # Run it normally with:    npm run test:viewport   (about a minute)
      #
      # It stays out of CI until it can pass, because a permanently red badge
      # gets ignored and then stops meaning anything. That is a real gap, not a
      # decision anyone should be comfortable with.
      #
      # - name: Viewport and interaction checks
      #   run: npm run test:viewport
